name: iOS Build and TestFlight

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    name: Build and Deploy to TestFlight
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

    - name: Setup Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '5.9'

    - name: Build iOS App
      run: |
        xcodebuild -scheme EndgameFitnessMobile \
          -destination generic/platform=iOS \
          -configuration Release \
          -archivePath ${{ github.workspace }}/build/EndgameFitnessMobile.xcarchive \
          archive

    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath ${{ github.workspace }}/build/EndgameFitnessMobile.xcarchive \
          -exportPath ${{ github.workspace }}/build \
          -exportOptionsPlist ExportOptions.plist \
          -allowProvisioningUpdates

    - name: Upload to TestFlight
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      run: |
        echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
        xcrun altool --upload-app \
          -f ${{ github.workspace }}/build/EndgameFitnessMobile.ipa \
          --type ios \
          --apiKey $APP_STORE_CONNECT_API_KEY_ID \
          --apiIssuer $APP_STORE_CONNECT_API_ISSUER_ID
